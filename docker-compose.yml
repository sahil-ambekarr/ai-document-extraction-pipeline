# NOT VERIFIED LOCALLY: Docker is not installed on the build machine.
#
#   docker compose up --build                        # api + ollama, SQLite
#   docker compose exec ollama ollama pull llama3.2
#   docker compose exec ollama ollama pull qwen2.5vl:3b
#
#   MSSQL_SA_PASSWORD=<choose-one> docker compose --profile sqlserver up --build
#   (then set DATABASE_URL for the api service, see .env.example)

services:
  api:
    build:
      context: .
      args:
        WITH_MSSQL: ${WITH_MSSQL:-false}
    ports:
      - "4102:4102"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EXTRACTION_MODE: ${EXTRACTION_MODE:-auto}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.2}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////srv/var/extraction.db}
    volumes:
      - api-data:/srv/var
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"

  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  api-data:
  ollama-models:
  mssql-data:
